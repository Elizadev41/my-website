<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baking Recipe Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="search-section">
      <h1>Baking Recipe Finder</h1>
      <p>Type what you want to bake and find a recipe.</p>

      <div class="search-box">
        <input
        id="recipe-search"
        type="text"
        placeholder="e.g. chocolate cake, banana bread, cookies..."
        >
        <button id="search-button" type="button">Find Recipes</button>
      </div>
    </section>
    <section id="recipe-result" class="recipe-result">
      <h2>Ready to bake?</h2>
      <p>Your recipe will show up here.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
